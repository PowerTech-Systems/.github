<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-label="PowerBrick, batteries 12, 24 et 48 V">
<title>PowerBrick, batteries 12, 24 et 48 V</title>
<defs>
<radialGradient id="bg" cx="22%" cy="30%" r="95%">
  <stop offset="0" stop-color="#172832"/><stop offset=".55" stop-color="#0F1A27"/><stop offset="1" stop-color="#0A0F19"/>
</radialGradient>
<linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFC400"/><stop offset=".5" stop-color="#1FA9E1"/><stop offset="1" stop-color="#5BAE2E"/>
</linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="638" height="328" rx="22"/></clipPath>
<radialGradient id="glow" cx="100%" cy="0%" r="60%"><stop offset="0" stop-color="#FFC400" stop-opacity=".22"/><stop offset="1" stop-color="#FFC400" stop-opacity="0"/></radialGradient>
</defs>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect x="1" y="1" width="638" height="328" rx="22" fill="url(#bg)"/>
<g clip-path="url(#clip)"><rect width="640" height="330" fill="url(#glow)"/><rect width="640" height="5" fill="#FFC400"/></g>
<rect x="1" y="1" width="638" height="328" rx="22" fill="none" stroke="#1D2A3D" stroke-width="2"/>
<rect x="40" y="40" width="80" height="80" rx="18" fill="#FFC400" fill-opacity=".10" stroke="#FFC400" stroke-opacity=".35" stroke-width="1.5"/>
<g transform="translate(40 40)">
  <rect x="20" y="31" width="8" height="25" rx="2" fill="#FFC400" opacity=".55">
    <animate attributeName="width" values="8;40;40;8" keyTimes="0;.6;.85;1" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="14" y="25" width="52" height="37" rx="6" fill="none" stroke="#FFC400" stroke-width="3.5"/>
  <rect x="22" y="18" width="10" height="7" rx="2" fill="#FFC400"/><rect x="48" y="18" width="10" height="7" rx="2" fill="#FFC400"/></g>
<text x="144" y="80" font-size="38" font-weight="700" fill="#F3F7FC">PowerBrick</text>
<text x="145" y="112" font-size="20" font-weight="600" fill="#FFC400">Batteries 12 · 24 · 48 V</text>
<text x="40" y="172" font-size="20" fill="#C5D0DD">Le remplacement direct des batteries au plomb.</text>
<circle cx="47" cy="213" r="5" fill="#FFC400"/>
<text x="64" y="220" font-size="20" fill="#F3F7FC">3 000 cycles à 100 % de décharge</text>
<circle cx="47" cy="249" r="5" fill="#FFC400"/>
<text x="64" y="256" font-size="20" fill="#F3F7FC">Jusqu’à 16 batteries en parallèle</text>
<circle cx="47" cy="285" r="5" fill="#FFC400"/>
<text x="64" y="292" font-size="20" fill="#F3F7FC">Bluetooth, bus CAN, chauffage</text>
<text x="600" y="292" text-anchor="end" font-size="17" fill="#8C9BB0">Découvrir →</text>
