<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200" role="img" aria-label="15 ans d’expérience, LiFePO4, 819,2 V, 1 MWh et plus, ISO 9001">
<title>15 ans d’expérience, LiFePO4, 819,2 V, 1 MWh et plus, ISO 9001</title>
<defs>
<radialGradient id="bg" cx="22%" cy="30%" r="95%">
  <stop offset="0" stop-color="#172832"/><stop offset=".55" stop-color="#0F1A27"/><stop offset="1" stop-color="#0A0F19"/>
</radialGradient>
<linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFC400"/><stop offset=".5" stop-color="#1FA9E1"/><stop offset="1" stop-color="#5BAE2E"/>
</linearGradient>

</defs>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect x="1" y="1" width="1278" height="198" rx="22" fill="url(#bg)" stroke="#1D2A3D" stroke-width="2"/>
<rect x="108" y="40" width="40" height="6" rx="3" fill="#FFC400"><animate attributeName="opacity" values="1;.35;1" dur="3s" begin="0.0s" repeatCount="indefinite"/></rect>
<text x="128" y="104" text-anchor="middle" font-size="44" font-weight="700" fill="#F3F7FC">15+ ans</text>
<text x="128" y="142" text-anchor="middle" font-size="19" fill="#8C9BB0">à concevoir et fabriquer</text>
<text x="128" y="166" text-anchor="middle" font-size="19" fill="#8C9BB0">des batteries lithium</text>
<line x1="256" y1="48" x2="256" y2="152" stroke="#1D2A3D" stroke-width="2"/>
<rect x="364" y="40" width="40" height="6" rx="3" fill="#1FA9E1"><animate attributeName="opacity" values="1;.35;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
<text x="384" y="104" text-anchor="middle" font-size="44" font-weight="700" fill="#F3F7FC">LiFePO4</text>
<text x="384" y="142" text-anchor="middle" font-size="19" fill="#8C9BB0">lithium fer phosphate,</text>
<text x="384" y="166" text-anchor="middle" font-size="19" fill="#8C9BB0">sans cobalt ni nickel</text>
<line x1="512" y1="48" x2="512" y2="152" stroke="#1D2A3D" stroke-width="2"/>
<rect x="620" y="40" width="40" height="6" rx="3" fill="#5BAE2E"><animate attributeName="opacity" values="1;.35;1" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
<text x="640" y="104" text-anchor="middle" font-size="44" font-weight="700" fill="#F3F7FC">819,2 V</text>
<text x="640" y="142" text-anchor="middle" font-size="19" fill="#8C9BB0">tension nominale max.</text>
<text x="640" y="166" text-anchor="middle" font-size="19" fill="#8C9BB0">avec PowerModule</text>
<line x1="768" y1="48" x2="768" y2="152" stroke="#1D2A3D" stroke-width="2"/>
<rect x="876" y="40" width="40" height="6" rx="3" fill="#FFC400"><animate attributeName="opacity" values="1;.35;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
<text x="896" y="104" text-anchor="middle" font-size="44" font-weight="700" fill="#F3F7FC">1 MWh+</text>
<text x="896" y="142" text-anchor="middle" font-size="19" fill="#8C9BB0">de stockage d’énergie</text>
<text x="896" y="166" text-anchor="middle" font-size="19" fill="#8C9BB0">avec PowerRack</text>
<line x1="1024" y1="48" x2="1024" y2="152" stroke="#1D2A3D" stroke-width="2"/>
<rect x="1132" y="40" width="40" height="6" rx="3" fill="#1FA9E1"><animate attributeName="opacity" values="1;.35;1" dur="3s" begin="1.6s" repeatCount="indefinite"/></rect>
<text x="1152" y="104" text-anchor="middle" font-size="44" font-weight="700" fill="#F3F7FC">ISO 9001</text>
<text x="1152" y="142" text-anchor="middle" font-size="19" fill="#8C9BB0">certifié, fabrication</text>
<text x="1152" y="166" text-anchor="middle" font-size="19" fill="#8C9BB0">en France</text>
</g>
</svg>
